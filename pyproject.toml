[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charlm"
version = "0.1.0"
description = "A small character-level GPT for experimenting with pretraining, SFT, DPO and GRPO"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
charlm = "charlm.cli:main"

[tool.setuptools]
packages = ["charlm"]
